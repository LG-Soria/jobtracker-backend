services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtracker_test
      POSTGRES_USER: jobtracker_test
      POSTGRES_PASSWORD: jobtracker_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker_test -d jobtracker_test"]
      interval: 2s
      timeout: 5s
      retries: 20
